name: Validate rules

on:
  push:
  pull_request:
  workflow_dispatch:

# Validation only needs to read the checked-out repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate published rule sets
        run: python3 tests/validate_rules.py
